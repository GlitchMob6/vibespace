name: flutter_local_notifications_windows
description: Windows implementation of flutter_local_notifications
version: 3.1.1
homepage: https://github.com/MaikuB/flutter_local_notifications

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications_platform_interface: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: FlutterLocalNotificationsPlugin
        dartPluginClass: FlutterLocalNotificationsWindows
